# Docker swarm stack for Traefik production use
# https://doc.traefik.io/traefik/setup/swarm/
#
# Requires: docker swarm init (if not already initialized)
#
# Environment variables must be exported before deploying since
# docker stack deploy doesn't read .env files automatically.
#
# Export the variables into the shell before deploying the stack:
# set -a && source .env && set +a
#
# Or use docker secrets (preferred):
# https://docs.docker.com/engine/swarm/secrets/
# https://docs.docker.com/engine/swarm/secrets/#use-secrets-in-compose
#
# Deploy with: 
# docker stack deploy -c docker-compose-swarm.yml traefik
services:
  traefik:
    image: traefik:v3.6
    ports:
      - target: 80
        published: 80
        mode: host # bypass swarm routing mesh for real client IPs
      - target: 443
        published: 443
        mode: host
    volumes:
      - letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy
    command:
      - --log.level=INFO
      - --accesslog=true
      #- --api.dashboard=true
      - --api.insecure=false
      - --global.checkNewVersion=true
      - --global.sendAnonymousUsage=false
      # Docker provider for standalone compose services
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=traefik_proxy
      # Swarm provider for swarm-deployed services
      - --providers.swarm=true
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=traefik_proxy
      # Entrypoints
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.web.http.encodedcharacters.allowencodedslash=true
      # Let's Encrypt
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    deploy:
      mode: global # runs on every manager/node, use 'replicated' with replicas: 1 for single instance
      placement:
        constraints:
          - node.role == manager # needs docker.sock access, so pin to manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first # start new before stopping old for zero downtime
      #labels: # uncomment to enable the Traefik dashboard via swarm
        #- traefik.enable=true
        #- traefik.http.routers.dashboard.rule=Host(`traefik.yourdomain.com`)
        #- traefik.http.routers.dashboard.entrypoints=websecure
        #- traefik.http.routers.dashboard.tls=true
        #- traefik.http.routers.dashboard.tls.certresolver=letsencrypt
        #- traefik.http.routers.dashboard.service=api@internal
        #- traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_DASHBOARD_PW}
        #- traefik.http.routers.dashboard.middlewares=dashboard-auth@swarm
        #- traefik.http.routers.dashboard.middlewares=auth
        #- traefik.http.services.traefik.loadbalancer.server.port=8080 # required for swarm even if unused

volumes:
  letsencrypt:
    driver: local

networks:
  proxy:
    name: traefik_proxy
    driver: overlay
    attachable: true # allows standalone compose containers to join this network