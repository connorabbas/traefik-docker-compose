# For basic compose stack use on a single server
# https://doc.traefik.io/traefik/user-guides/docker-compose/acme-http/
# From the directory containing this file:
# cp .env.example .env
# docker compose up -d
services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy
    command:
      - --log.level=INFO
      - --accesslog=true
      #- --api.dashboard=true
      - --api.insecure=false
      - --global.checkNewVersion=true
      - --global.sendAnonymousUsage=false
      - --providers.docker=true
      - --providers.docker.network=traefik_proxy
      - --providers.docker.exposedByDefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --entrypoints.web.http.encodedcharacters.allowencodedslash=true
    # labels:
    #   # Enable self‑routing
    #   - traefik.enable=true
    #   # Dashboard router
    #   - traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN}`)
    #   - traefik.http.routers.dashboard.entrypoints=websecure
    #   - traefik.http.routers.dashboard.service=api@internal
    #   - traefik.http.routers.dashboard.tls=true
    #   - traefik.http.routers.dashboard.tls.certresolver=letsencrypt
    #   # Basic‑auth middleware
    #   - traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_AUTH_USERS}
    #   - traefik.http.routers.dashboard.middlewares=dashboard-auth@docker

networks:
  proxy:
    name: traefik_proxy
