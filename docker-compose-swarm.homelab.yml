# Docker swarm stack enabled configuration for homelab environment using HTTPS with DNS Challenge & Cloudflare
# Works with a Split-Horizon DNS setup not exposed to the public internet
# inspired by: https://dev.to/jhonoryza/traefik-cloudflare-dns-challenge-3b7m
#
# Requires: docker swarm init (if not already initialized)
#
# Environment variables must be exported before deploying since
# docker stack deploy doesn't read .env files automatically.
#
# Export the variables into the shell before deploying the stack:
# set -a && source .env && set +a
#
# Or use docker secrets:
# https://docs.docker.com/engine/swarm/secrets/
# https://docs.docker.com/engine/swarm/secrets/#use-secrets-in-compose
#
# Deploy with: 
# docker stack deploy -c docker-compose-swarm.homelab.yml traefik
services:
  traefik:
    image: traefik:v3.6
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    volumes:
      - letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy
    command:
      - --log.level=INFO
      - --api.insecure=false
      - --global.checkNewVersion=true
      - --global.sendAnonymousUsage=false
      # Docker provider for standalone compose services
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=traefik_proxy
      # Swarm provider for swarm-deployed services
      - --providers.swarm=true
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=traefik_proxy
      # Entrypoints
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.web.http.encodedcharacters.allowencodedslash=true
      # Wildcard TLS via Cloudflare DNS challenge
      - --entrypoints.websecure.http.tls.domains[0].main=${DOMAIN}
      - --entrypoints.websecure.http.tls.domains[0].sans=*.${DOMAIN}
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.propagation.delaybeforechecks=60
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first

volumes:
  letsencrypt:
    driver: local

networks:
  proxy:
    name: traefik_proxy
    driver: overlay
    attachable: true