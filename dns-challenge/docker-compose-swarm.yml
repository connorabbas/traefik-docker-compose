# Docker swarm stack enabled configuration using HTTPS with DNS Challenge using Cloudflare
# Works with Split-Horizon DNS setups not exposed to the public internet, great for homelab environments
# inspired by: https://dev.to/jhonoryza/traefik-cloudflare-dns-challenge-3b7m
#
# Requires: docker swarm init (if not already initialized)
#
# Environment variables must be exported before deploying since
# docker stack deploy doesn't read .env files automatically.
#
# From the directory containing this file, export variables before deploying:
# cp .env.example .env
# set -a && source .env && set +a
#
# Or use docker secrets:
# https://docs.docker.com/engine/swarm/secrets/
# https://docs.docker.com/engine/swarm/secrets/#use-secrets-in-compose
#
# Deploy with:
# docker stack deploy -c docker-compose-swarm.yml traefik
services:
  traefik:
    image: traefik:v3.7
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    volumes:
      - letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy
    command:
      - --log.level=INFO
      - --accesslog=true
      - --api.insecure=false
      - --global.checkNewVersion=true
      - --global.sendAnonymousUsage=false
      # Docker provider for standalone compose services
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=traefik_proxy
      # Swarm provider for swarm-deployed services
      - --providers.swarm=true
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=traefik_proxy
      # Entrypoints
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.web.http.encodedcharacters.allowencodedslash=true
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.propagation.delaybeforechecks=60
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
      # Optional: uncomment for an apex + wildcard certificate. Useful for homelab
      # split-horizon DNS or wildcard subdomain routing. For standard production
      # routing, set tls.certresolver=letsencrypt on each application router instead.
      # - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      # - --entrypoints.websecure.http.tls.domains[0].main=${DOMAIN}
      # - --entrypoints.websecure.http.tls.domains[0].sans=*.${DOMAIN}
    deploy:
      # Keep a single Traefik replica when using the local acme.json storage.
      # Traefik OSS does not coordinate Let's Encrypt state across replicas.
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first

volumes:
  letsencrypt:
    driver: local

networks:
  proxy:
    name: traefik_proxy
    driver: overlay
    attachable: true
